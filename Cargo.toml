[workspace]
resolver = "2"
members = [
    "crates/procgeo-core",
    "crates/procgeo-sops",
    "crates/procgeo-io",
    "crates/procgeo",
    "crates/procgeo-cops",
    "bindings/procgeo-node",
    "bindings/procgeo-py",
    "bindings/procgeo-wasm",
    "benchmarks/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vochsel/rs-procgeo"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
bitvec = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
approx = "0.5"
rand = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
wgpu = "24"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
naga = { version = "24", features = ["glsl-in", "wgsl-out"] }
bytemuck = { version = "1.21", features = ["derive"] }
nalgebra = "0.33"
robust = "1.1"
