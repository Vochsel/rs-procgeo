<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcGeo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #181820; }
      #app { position: fixed; inset: 0; }
      #canvas { width: 100%; height: 100%; display: block; }
      #toolbar {
        position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap;
        font: 12px system-ui, sans-serif;
      }
      #toolbar button {
        background: #2a2a38; color: #e8e8f0; border: 1px solid #3a3a4a;
        border-radius: 6px; padding: 6px 10px; cursor: pointer;
      }
      #toolbar button:hover { background: #34344a; }
      #status {
        position: fixed; bottom: 10px; left: 12px; color: #8a8aa0;
        font: 12px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="toolbar"></div>
      <div id="status">Cooking…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
