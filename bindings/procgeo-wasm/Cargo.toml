[package]
name = "procgeo-wasm"
version = "0.1.0"
edition = "2021"
description = "Procedural geometry library inspired by Houdini SOPs — WASM bindings"
license = "MIT"
repository = "https://github.com/vochsel/rs-procgeo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
procgeo-core = { path = "../../crates/procgeo-core" }
procgeo-sops = { path = "../../crates/procgeo-sops" }
procgeo-io = { path = "../../crates/procgeo-io" }
procgeo-cops = { path = "../../crates/procgeo-cops" }
glam = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
