<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcGeo Playground</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <span class="logo">ProcGeo</span>
            <span class="separator"></span>
            <button id="run-btn" title="Run (Ctrl+Enter)">Run</button>
            <span id="status"></span>
            <span class="spacer"></span>
            <select id="examples">
                <option value="">Examples...</option>
                <optgroup label="Basics">
                    <option value="starterScene">Starter Scene</option>
                    <option value="basic">Basic Box</option>
                    <option value="allPrimitives">All Primitives</option>
                    <option value="subdiv">Catmull-Clark Sphere</option>
                    <option value="smoothSphere">Smoothed Sphere</option>
                </optgroup>
                <optgroup label="Noise &amp; Terrain">
                    <option value="noiseDisplace">Noise Terrain</option>
                    <option value="textureDisplace">Texture Heightmap</option>
                    <option value="copDisplaceImage">COP Heightmap Mesh</option>
                    <option value="noisyTorus">Noisy Torus</option>
                    <option value="scatterForest">Scatter Forest</option>
                </optgroup>
                <optgroup label="Operations">
                    <option value="scatter">Scatter + Instances</option>
                    <option value="attribTransfer">Attrib Transfer</option>
                    <option value="extrude">Extrude City</option>
                    <option value="extrudeTower">Extrude Tower</option>
                    <option value="clippedTorus">Clipped Torus</option>
                    <option value="reversedGrid">Reversed Normals</option>
                    <option value="fusedCubes">Fused Cubes</option>
                </optgroup>
                <optgroup label="Booleans &amp; Groups">
                    <option value="groupBooleans">Group Booleans</option>
                    <option value="metaballs">Metaballs (Implicit Union)</option>
                </optgroup>
                <optgroup label="Advanced">
                    <option value="fracture">Voronoi Fracture</option>
                    <option value="building">Building (Merge + Colors)</option>
                    <option value="stressTest">Stress Test</option>
                </optgroup>
                <optgroup label="Deform">
                    <option value="bendTube">Bent Tube</option>
                    <option value="twistColumn">Twisted Column</option>
                    <option value="squashStretch">Squash &amp; Stretch</option>
                    <option value="taperCone">Tapered Cone</option>
                    <option value="pointDeformWave">Point Deform Wave</option>
                </optgroup>
                <optgroup label="Quad Remeshing">
                    <option value="quadWild">QuadWild Sphere</option>
                    <option value="quadWildBox">QuadWild Box</option>
                </optgroup>
                <optgroup label="Boolean CSG">
                    <option value="booleanUnion">Boolean Union</option>
                    <option value="booleanSubtract">Boolean Subtract</option>
                    <option value="booleanIntersect">Boolean Intersect</option>
                </optgroup>
                <optgroup label="Image COPs">
                    <option value="copTerrainHeightmap">Terrain Heightmap</option>
                    <option value="copNeonGrid">Neon Grid</option>
                    <option value="copMarbleTexture">Marble Texture</option>
                    <option value="copPlasmaShader">Plasma Shader</option>
                    <option value="copGlowEffect">Glow Effect</option>
                    <option value="copRustyMetal">Rusty Metal</option>
                    <option value="copWoodGrain">Wood Grain</option>
                    <option value="copLavaFlow">Lava Flow</option>
                    <option value="copCamouflage">Camouflage</option>
                    <option value="copOceanCaustics">Ocean Caustics</option>
                    <option value="copTiledMosaic">Tiled Mosaic</option>
                </optgroup>
            </select>
            <div id="view-modes">
                <button class="view-mode-btn" data-mode="shaded" title="Shaded">Shaded</button>
                <button class="view-mode-btn active" data-mode="shaded_wire" title="Shaded + Wireframe">Shaded+Wire</button>
                <button class="view-mode-btn" data-mode="wire" title="Wireframe">Wire</button>
            </div>
            <span class="separator"></span>
            <button id="export-obj" title="Export OBJ">OBJ</button>
            <button id="export-glb" title="Export GLB">GLB</button>
            <span class="separator"></span>
            <button id="share-btn" title="Copy shareable link">Share</button>
            <a href="/docs/" target="_blank" rel="noreferrer" class="toolbar-link" title="API Reference">Docs</a>
            <a href="https://github.com/vochsel/rs-procgeo" target="_blank" rel="noreferrer" class="toolbar-link" title="GitHub Repository">GitHub</a>
        </div>
        <div id="panels">
            <div id="editor-panel">
                <div id="editor"></div>
            </div>
            <div id="divider"></div>
            <div id="viewer-panel">
                <div id="viewer-tabs">
                    <button class="viewer-tab active" data-view="viewport">Viewport</button>
                    <button class="viewer-tab" data-view="spreadsheet">Spreadsheet</button>
                    <span id="viewer-tab-info"></span>
                </div>
                <div id="viewport-view" class="viewer-view active">
                    <canvas id="canvas"></canvas>
                    <canvas id="cop-canvas"></canvas>
                </div>
                <div id="spreadsheet-view" class="viewer-view">
                    <div id="spreadsheet-subtabs">
                        <button class="subtab active" data-class="point">Points</button>
                        <button class="subtab" data-class="vertex">Vertices</button>
                        <button class="subtab" data-class="primitive">Primitives</button>
                        <button class="subtab" data-class="detail">Detail</button>
                        <span id="spreadsheet-info"></span>
                    </div>
                    <div id="spreadsheet-body">
                        <table id="spreadsheet-table">
                            <thead><tr id="spreadsheet-thead-row"></tr></thead>
                            <tbody id="spreadsheet-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
